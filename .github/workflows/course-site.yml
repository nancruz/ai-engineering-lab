name: Build visual RAG course
on:
  push:
    branches: [main]
    paths: ['tracks/rag/**', 'foundations/**', 'projects/README.md', 'README.md', 'course-site/**', 'scripts/build_course_site.py', 'tests/site/**', '.github/workflows/course-site.yml']
  pull_request:
    paths: ['tracks/rag/**', 'foundations/**', 'projects/README.md', 'README.md', 'course-site/**', 'scripts/build_course_site.py', 'tests/site/**', '.github/workflows/course-site.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built course to GitHub Pages (enable Pages / GitHub Actions in repository settings first)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: course-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r course-site/requirements.txt
      - run: python -m unittest discover -s tests/site -p 'test*.py' -v
      - run: node --check course-site/assets/app.js
      - run: python scripts/build_course_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish built course
        id: deployment
        uses: actions/deploy-pages@v4
